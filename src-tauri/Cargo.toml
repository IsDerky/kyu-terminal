[package]
name = "kyu-terminal"
version = "0.5.5"
edition = "2024"
description = "Terminal con Claude Code integrado"
license = "MIT"
repository = "https://github.com/IsDerky/kyu-terminal"

[lib]
name = "kyu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kyu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
tiny_http = "0.12"
tauri-plugin-notification = "2"
toml_edit = "0.23"
gif = "0.14.2"
ignore = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
# La misma que trae Tauri: para pedirle a WebView2 menos memoria en segundo plano.
webview2-com = "0.39"

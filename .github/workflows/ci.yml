name: ci

on:
  push:
    branches: [main, tauri]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela el run anterior (no se gastan minutos en lo viejo).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Misma clave en ci y release (por sistema): la etiqueta lee la caché que deja el CI de main.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: kyu
          key: ${{ matrix.os }}

      - name: Dependencias del frontend
        run: pnpm install --frozen-lockfile

      - name: Tipos y build del frontend
        run: pnpm build

      - name: Pruebas del frontend
        run: pnpm pruebas

      - name: Formato
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Pruebas de Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Instaladores
        run: pnpm tauri build

      - name: Portable (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/portable.ps1

      # Arranca Kyu en una pantalla virtual: tiene que seguir abierto a los 15 s y haber
      # abierto su shell con el prompt de Kyu (eso ya lo pide la interfaz).
      - name: Arranca en Linux
        if: runner.os == 'Linux'
        # Sin GPU en Xvfb, WebKitGTK pinta en negro si no dibuja por software.
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get install -y xvfb imagemagick
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            src-tauri/target/release/kyu > kyu.log 2>&1 &
            pid=$!
            sleep 15
            import -window root kyu-linux.png || true
            if ! kill -0 $pid 2>/dev/null; then echo "Kyu se ha cerrado"; cat kyu.log; exit 1; fi
            if ! pgrep -f "kyu.bash" > /dev/null; then echo "Kyu no ha abierto la shell"; cat kyu.log; kill $pid; exit 1; fi
            echo "Kyu abierto y con su shell a los 15 s"
            kill $pid'
          tail -20 kyu.log || true

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: kyu-linux-captura
          path: kyu-linux.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: kyu-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.zip
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

name: release

# Al subir una etiqueta vX.Y.Z: instaladores firmados para el actualizador, latest.json y la
# portable en la release de esa etiqueta. La clave del actualizador va en el secreto
# TAURI_SIGNING_PRIVATE_KEY (sin contraseña).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    strategy:
      fail-fast: false
      matrix:
        # 22.04: la AppImage arranca también en distribuciones algo más viejas.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Misma clave en ci y release (por sistema): la etiqueta lee la caché que deja el CI de main.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: kyu
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kyu Terminal ${{ github.ref_name }}
          releaseBody: |
            Windows: el instalador `.exe` (o el `.msi`), o el zip portable.
            Linux: la `.AppImage` o el `.deb`.
            Las versiones instaladas se actualizan solas.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Portable (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell -NoProfile -File scripts/portable.ps1
          gh release upload "${{ github.ref_name }}" (Get-ChildItem src-tauri/target/release/bundle/portable/*.zip).FullName --clobber
